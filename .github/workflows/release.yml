name: Release

on:
  push:
    branches:
      - main
    paths:
      - "smart-remote-card.js"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read card version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^const SMART_REMOTE_VERSION = "\([^"]*\)";$/\1/p' smart-remote-card.js | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read SMART_REMOTE_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          NOTES_FILE="$(mktemp)"
          awk -v version="## v$VERSION" '
            $0 ~ "^" version {capture=1; next}
            capture && /^## v/ {exit}
            capture {print}
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf "Smart Remote Card v%s\n" "$VERSION" > "$NOTES_FILE"
          fi
          gh release create "$TAG" \
            --title "Smart Remote Card $TAG" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
